<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact the car owner</title>
<style>
  :root { --bg:#f6f7f4; --ink:#1b2a2f; --muted:#5b6b70; --accent:#0f766e; --card:#fff; --line:#d9dfdc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12191b; --ink:#eef3f1; --muted:#9fb0b4; --accent:#2dd4bf; --card:#1a2427; --line:#2b383b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:20px; background:var(--bg); color:var(--ink);
         font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line);
         border-radius:16px; padding:24px; }
  h1 { font-size:1.4rem; margin:0 0 6px; }
  p { margin:0 0 16px; color:var(--muted); }
  .opts { display:grid; gap:10px; margin-bottom:16px; }
  button { font:inherit; width:100%; padding:14px; border-radius:12px; cursor:pointer;
           border:1px solid var(--line); background:transparent; color:var(--ink); text-align:left; }
  button[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  input { font:inherit; width:100%; padding:12px; margin-bottom:16px; border-radius:12px;
          border:1px solid var(--line); background:transparent; color:var(--ink); }
  #send { background:var(--accent); color:#fff; border:0; text-align:center; font-weight:600; }
  @media (prefers-color-scheme: dark) { #send { color:#062b27; } }
  #send:disabled { opacity:.6; cursor:default; }
  #status { margin:14px 0 0; min-height:1.5em; }
  small { display:block; margin-top:12px; color:var(--muted); font-size:.8rem; }
</style>
</head>
<body>
<main>
  <h1>Need the owner of this car?</h1>
  <p>Pick a reason and I'll be notified right away. You won't see my number and I won't see yours unless you add it.</p>

  <div class="opts" id="opts" role="group" aria-label="Reason">
    <button type="button" data-msg="Your car is blocking mine." aria-pressed="true">My car is blocked</button>
    <button type="button" data-msg="Your car lights or alarm are on.">Lights or alarm are on</button>
    <button type="button" data-msg="Your car may be damaged or a window is open.">Possible damage or open window</button>
    <button type="button" data-msg="Someone needs to talk to you about your car.">Something else</button>
  </div>

  <label for="contact" class="sr" style="display:none">Contact</label>
  <input id="contact" type="text" placeholder="Optional: your name or number so I can reply" maxlength="80" autocomplete="off">

  <button id="send" type="button">Notify owner</button>
  <div id="status" role="status" aria-live="polite"></div>
  <small>Your message is sent as a push notification. Nothing else is collected.</small>
</main>

<script>
  // CHANGE THIS to a long random topic, and subscribe to the same topic in the ntfy app.
  var TOPIC = "car-alert-b3f8j2kd91msqp47";
  var COOLDOWN_MS = 60000; // one alert per minute per visitor

  var chosen = document.querySelector("#opts button").dataset.msg;
  document.querySelectorAll("#opts button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll("#opts button").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      chosen = b.dataset.msg;
    });
  });

  var sendBtn = document.getElementById("send");
  var statusEl = document.getElementById("status");

  sendBtn.addEventListener("click", function () {
    var last = 0;
    try { last = +localStorage.getItem("lastSent") || 0; } catch (e) {}
    if (Date.now() - last < COOLDOWN_MS) {
      statusEl.textContent = "Already sent. Please wait a minute before sending again.";
      return;
    }
    var contact = document.getElementById("contact").value.trim();
    var body = chosen + (contact ? "\nReply to: " + contact : "");
    sendBtn.disabled = true;
    statusEl.textContent = "Sending...";
    fetch("https://ntfy.sh/" + encodeURIComponent(TOPIC), {
      method: "POST",
      headers: { "Title": "Car alert", "Priority": "high", "Tags": "car" },
      body: body
    }).then(function (r) {
      if (!r.ok) throw new Error();
      try { localStorage.setItem("lastSent", String(Date.now())); } catch (e) {}
      statusEl.textContent = "Owner notified. Thank you, they'll be with you shortly.";
    }).catch(function () {
      statusEl.textContent = "Couldn't send. Check your connection and try again.";
    }).finally(function () { sendBtn.disabled = false; });
  });
</script>
</body>
</html>
